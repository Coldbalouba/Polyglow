# Runs TutConnect on one small VPS: app + Postgres + Caddy (automatic HTTPS) + jobs (hourly tasks, daily backups).
# Usage: cp .env.example .env  (fill it in)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutconnect
      POSTGRES_USER: tutconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutconnect -d tutconnect"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tutconnect:${POSTGRES_PASSWORD}@db:5432/tutconnect
      DIRECT_URL: postgresql://tutconnect:${POSTGRES_PASSWORD}@db:5432/tutconnect
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  jobs:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/jobs.sh:/jobs.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/jobs.sh"]
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
