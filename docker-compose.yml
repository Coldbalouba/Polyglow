# Runs Polyglow on one small VPS: app + Postgres + Caddy (automatic HTTPS) + jobs (hourly tasks, daily backups).
# Usage: cp .env.example .env  (fill it in)  &&  docker compose up -d --build
# Tuned to fit a 2 GB server. On a 1-2 GB server, set APP_IMAGE in .env to use the image
# GitHub builds for you (see HOSTING.md) instead of building on the server.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Small-server settings: plenty for thousands of users.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "max_connections=30", "-c", "effective_cache_size=256MB"]
    shm_size: 128mb
    mem_limit: 384m
    environment:
      POSTGRES_DB: polyglow
      POSTGRES_USER: polyglow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyglow -d polyglow"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${APP_IMAGE:-polyglow-app:local}
    build: .
    restart: unless-stopped
    env_file: .env
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      NODE_OPTIONS: --max-old-space-size=320
      # connection_limit keeps Prisma's pool small to match max_connections above.
      DATABASE_URL: postgresql://polyglow:${POSTGRES_PASSWORD}@db:5432/polyglow?connection_limit=10
      DIRECT_URL: postgresql://polyglow:${POSTGRES_PASSWORD}@db:5432/polyglow
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  jobs:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 128m
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/jobs.sh:/jobs.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/jobs.sh"]
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
